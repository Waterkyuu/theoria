name: Benchmark

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Benchmark frontend build
        shell: bash
        run: |
          SECONDS=0
          pnpm build
          build_seconds=$SECONDS
          total_bytes=$(find dist -type f -exec wc -c {} \; | awk '{sum += $1} END {print sum+0}')
          js_bytes=$(find dist -type f -name '*.js' -exec wc -c {} \; | awk '{sum += $1} END {print sum+0}')
          css_bytes=$(find dist -type f -name '*.css' -exec wc -c {} \; | awk '{sum += $1} END {print sum+0}')
          {
            echo '### Frontend build benchmark'
            echo ''
            echo '| Metric | Value |'
            echo '| --- | ---: |'
            echo "| Build time | ${build_seconds} s |"
            echo "| dist total | ${total_bytes} bytes |"
            echo "| JavaScript | ${js_bytes} bytes |"
            echo "| CSS | ${css_bytes} bytes |"
            echo ''
            echo 'Measures pnpm build (type-check + Vite production build), excluding dependency installation. Sizes are uncompressed file sizes.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust build benchmark
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Benchmark Rust release build
        shell: bash
        run: |
          SECONDS=0
          cargo build --manifest-path src-tauri/Cargo.toml --locked --release --all-features --bin agent-gauge
          build_seconds=$SECONDS
          binary=src-tauri/target/release/agent-gauge
          binary_bytes=$(wc -c < "$binary" | tr -d '[:space:]')
          {
            echo '### Rust backend build benchmark'
            echo ''
            echo '| Metric | Value |'
            echo '| --- | ---: |'
            echo "| Runner | ${RUNNER_OS} / ${RUNNER_ARCH} |"
            echo "| Release build time | ${build_seconds} s |"
            echo "| Executable | ${binary_bytes} bytes |"
            echo ''
            echo 'Measures cargo build --release with all features and the existing Rust cache enabled. Executable size excludes installer packaging; this is not a cold-build benchmark.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
