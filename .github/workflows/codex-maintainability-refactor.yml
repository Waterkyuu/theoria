name: Codex Maintainability Refactor

on:
  schedule:
    # GitHub cron uses UTC. Run every Sunday at 10:30 Asia/Shanghai.
    - cron: "30 2 * * 0"
  workflow_dispatch:

concurrency:
  group: codex-maintainability-refactor
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refactor:
    name: Refactor one maintainability issue
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      HUSKY: 0
    steps:
      - name: Check existing pull requests
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          open_refactor_prs="$(gh pr list \
            --state open \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("waterkyuu/codex-maintainability-"))] | length')"
          if (( open_refactor_prs > 0 )); then
            echo "An automated maintainability pull request is already open."
            echo "should-run=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "should-run=true" >> "${GITHUB_OUTPUT}"

      - name: Create theoria-autofix token
        if: steps.preflight.outputs.should-run == 'true'
        id: autofix-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.THEORIA_AUTOFIX_CLIENT_ID }}
          private-key: ${{ secrets.THEORIA_AUTOFIX_PRIVATE_KEY }}

      - name: Checkout repository
        if: steps.preflight.outputs.should-run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        if: steps.preflight.outputs.should-run == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.preflight.outputs.should-run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.preflight.outputs.should-run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        if: steps.preflight.outputs.should-run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        if: steps.preflight.outputs.should-run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Check DeepSeek credentials
        if: steps.preflight.outputs.should-run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${DEEPSEEK_API_KEY}" ]]; then
            echo "DEEPSEEK_API_KEY repository secret is required." >&2
            exit 1
          fi

      - name: Run Codex maintainability refactor with DeepSeek
        if: steps.preflight.outputs.should-run == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          responses-api-endpoint: https://api.deepseek.com/responses
          prompt-file: .github/codex/prompts/maintainability-refactor.md
          model: deepseek-flash
          effort: high
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          output-file: ${{ runner.temp }}/codex-output.md

      - name: Inspect proposed refactor
        if: steps.preflight.outputs.should-run == 'true'
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$({
            git diff --name-only --diff-filter=ACDMRTUXB HEAD
            git ls-files --others --exclude-standard
          } | sort -u)"

          if [[ -z "${changed_files}" ]]; then
            echo "Codex found no safe maintainability refactor."
            echo "has-changes=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_count="$(printf '%s\n' "${changed_files}" | wc -l | tr -d ' ')"
          if (( changed_count > 5 )); then
            echo "Codex changed ${changed_count} files; the limit is 5." >&2
            exit 1
          fi

          frontend=false
          rust=false
          tauri_build=false
          non_test_lines=0
          while IFS= read -r file; do
            case "${file}" in
              .github/workflows/* | .github/codex/*)
                echo "Codex changed protected automation file: ${file}" >&2
                exit 1
                ;;
              pnpm-lock.yaml | src-tauri/Cargo.lock | */vendor/* | */generated/* | */migrations/*)
                echo "Codex changed a protected generated, vendored, migration, or lock file: ${file}" >&2
                exit 1
                ;;
              src-tauri/*)
                rust=true
                ;;
              *)
                frontend=true
                ;;
            esac

            case "${file}" in
              src-tauri/Cargo.toml | src-tauri/tauri.conf.json | src-tauri/build.rs | \
                src-tauri/capabilities/* | src-tauri/permissions/* | src-tauri/src/platform/*)
                tauri_build=true
                ;;
            esac

            case "${file}" in
              *.test.* | *.spec.* | tests/* | */tests/*)
                continue
                ;;
            esac

            if git ls-files --error-unmatch -- "${file}" >/dev/null 2>&1; then
              while IFS=$'\t' read -r additions deletions _; do
                if [[ "${additions}" == "-" || "${deletions}" == "-" ]]; then
                  echo "Codex changed binary non-test file: ${file}" >&2
                  exit 1
                fi
                non_test_lines=$((non_test_lines + additions + deletions))
              done < <(git diff --numstat HEAD -- "${file}")
            else
              non_test_lines=$((non_test_lines + $(wc -l < "${file}")))
            fi
          done <<< "${changed_files}"

          if (( non_test_lines >= 200 )); then
            echo "Codex changed ${non_test_lines} non-test lines; the limit is below 200." >&2
            exit 1
          fi

          git diff HEAD --check
          printf '%s\n' "${changed_files}"
          echo "has-changes=true" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "rust=${rust}" >> "${GITHUB_OUTPUT}"
          echo "tauri-build=${tauri_build}" >> "${GITHUB_OUTPUT}"

      - name: Validate frontend refactor
        if: steps.changes.outputs.frontend == 'true'
        run: |
          pnpm typecheck
          pnpm check
          pnpm test
          pnpm build

      - name: Validate Rust refactor
        if: steps.changes.outputs.rust == 'true'
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-features
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Validate Tauri build
        if: steps.changes.outputs.tauri-build == 'true'
        run: pnpm tauri build --no-bundle

      - name: Commit and open draft pull request
        if: steps.changes.outputs.has-changes == 'true'
        env:
          GH_TOKEN: ${{ steps.autofix-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="waterkyuu/codex-maintainability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "${branch}"
          bot_slug="${{ steps.autofix-token.outputs.app-slug }}"
          bot_user_id="$(gh api "/users/${bot_slug}%5Bbot%5D" --jq .id)"
          git config user.name "${bot_slug}[bot]"
          git config user.email "${bot_user_id}+${bot_slug}[bot]@users.noreply.github.com"
          git add --all
          git commit \
            -m "refactor(repo): reduce maintainability debt" \
            -m $'- remove one verified maintainability issue\n- preserve behavior and public contracts\n- pass applicable project validation'
          gh auth setup-git
          git push origin "HEAD:refs/heads/${branch}"

          pull_request_body="${RUNNER_TEMP}/codex-maintainability-pr.md"
          {
            echo "## Summary"
            echo
            echo "Codex with DeepSeek V4.1 Flash completed one bounded maintainability refactor."
            echo
            echo "## Codex report"
            echo
            cat "${RUNNER_TEMP}/codex-output.md"
            echo
            echo "## Changed files"
            echo
            git show --stat --oneline --format= HEAD
            echo
            echo "## Validation"
            echo
            echo "Applicable frontend, Rust, and Tauri checks completed successfully before this PR was opened."
            echo
            echo "## Risk review"
            echo
            echo "This is a draft PR. Confirm behavior preservation and the value of removing the abstraction before merging."
          } > "${pull_request_body}"

          gh pr create \
            --draft \
            --base main \
            --head "${branch}" \
            --title "refactor(repo): reduce maintainability debt" \
            --body-file "${pull_request_body}"
